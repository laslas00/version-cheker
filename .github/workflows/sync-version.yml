
name: Sync Version to JSON

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/sync-version.yml'

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Update version.json
        id: update
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")

          node -e "
            const fs = require('fs');
            const version = require('./package.json').version;
            const data = {
              version,
              releaseDate: new Date().toISOString().slice(0, 10)
            };
            fs.writeFileSync('version.json', JSON.stringify(data, null, 2) + '\n');
          "

          if git diff --quiet -- version.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "version.json is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Updated version.json to $VERSION"
          fi

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version.json
          git commit -m "chore: sync version.json"
          git push
